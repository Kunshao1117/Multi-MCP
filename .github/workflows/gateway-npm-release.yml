name: Gateway npm Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Gateway package version to publish'
        required: true
        type: string
      expected_commit:
        description: 'Full main commit SHA that passed release checks'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: gateway-npm-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate release revision
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          assert.equal(process.env.GITHUB_REF, 'refs/heads/main', 'Only main can publish');
          assert.match(process.env.EXPECTED_COMMIT, /^[0-9a-f]{40}$/);
          assert.equal(process.env.EXPECTED_COMMIT, process.env.GITHUB_SHA, 'main changed since verification');
          assert.match(process.env.RELEASE_VERSION, /^\d+\.\d+\.\d+$/);
          JS
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Validate package identity and npm OIDC support
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(pkg.name, 'multi-mcp-gateway');
          assert.equal(pkg.version, process.env.RELEASE_VERSION);
          assert.equal(pkg.repository.url, 'git+https://github.com/Kunshao1117/Multi-MCP.git');
          const npm = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim().split('.').map(Number);
          assert.ok(npm[0] > 11 || (npm[0] === 11 && (npm[1] > 5 || (npm[1] === 5 && npm[2] >= 1))), 'npm >=11.5.1 required');
          JS
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify types, all tests, build and real SDK runtime
        run: npm run preflight:gateway
      - name: Require zero production advisories
        run: npm audit --omit=dev --audit-level=low
      - name: Pack and verify installable tarball
        run: |
          npm pack --json > pack.json
          node scripts/verify-release-tarball.mjs pack.json
      - name: Refuse an already published version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const response = await fetch('https://registry.npmjs.org/multi-mcp-gateway');
          assert.equal(response.status, 200, 'Could not verify registry state');
          const metadata = await response.json();
          assert.ok(!Object.hasOwn(metadata.versions, process.env.RELEASE_VERSION), 'Version already published');
          JS
      - name: Publish verified tarball with trusted publishing
        run: |
          tarball=$(node -p "JSON.parse(require('fs').readFileSync('pack.json','utf8'))[0].filename")
          npm publish "$tarball" --provenance --access public
